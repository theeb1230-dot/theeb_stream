name: P0 buffering watchdog patch

on:
  push:
    branches:
      - p0/source-health-back-search-registry-2.1.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/source-health-back-search-registry-2.1.3
          fetch-depth: 0
      - name: Add bounded runtime buffering recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/m3u8_video_player_screen.dart')
          t = p.read_text()

          anchors = [
            (
              "  Timer? _progressTimer;\n  bool _isLeaving = false;",
              "  Timer? _progressTimer;\n  Timer? _bufferingWatchdog;\n  Duration _bufferingWatchdogPosition = Duration.zero;\n  bool _isLeaving = false;",
            ),
            (
              "    final isBuffering = value.isBuffering;\n    var shouldRebuild = isBuffering != _isBuffering;\n    _isBuffering = isBuffering;",
              "    final isBuffering = value.isBuffering;\n    var shouldRebuild = isBuffering != _isBuffering;\n    if (isBuffering && !_isBuffering) {\n      _startBufferingWatchdog(controller);\n    } else if (!isBuffering && _isBuffering) {\n      _cancelBufferingWatchdog();\n    }\n    _isBuffering = isBuffering;",
            ),
            (
              "  Map<String, dynamic>? _nextServerAfter(String currentUrl) {",
              "  void _cancelBufferingWatchdog() {\n    _bufferingWatchdog?.cancel();\n    _bufferingWatchdog = null;\n  }\n\n  void _startBufferingWatchdog(VideoPlayerController controller) {\n    if (_offlinePath != null || _recoveringPlayback || _isLeaving) return;\n    _cancelBufferingWatchdog();\n    _bufferingWatchdogPosition = controller.value.position;\n    _bufferingWatchdog = Timer(const Duration(seconds: 12), () {\n      if (!mounted || _isLeaving || _recoveringPlayback) return;\n      if (!identical(controller, _videoPlayerController)) return;\n      final value = controller.value;\n      final advanced =\n          value.position - _bufferingWatchdogPosition >= const Duration(seconds: 1);\n      if (value.isBuffering && !value.hasError && !advanced) {\n        final currentKey = _selectedServerKey;\n        if (currentKey != null) _failedServerKeys.add(currentKey);\n        _showStatus('الخادم عالق في التحميل، جارٍ تجربة خادم آخر...');\n        unawaited(_recoverPlayback());\n      }\n    });\n  }\n\n  Map<String, dynamic>? _nextServerAfter(String currentUrl) {",
            ),
            (
              "  Future<void> _recoverPlayback() async {\n    final url = _currentStreamUrl;",
              "  Future<void> _recoverPlayback() async {\n    _cancelBufferingWatchdog();\n    final url = _currentStreamUrl;",
            ),
            (
              "    _progressTimer?.cancel();\n    unawaited(_saveProgress());",
              "    _progressTimer?.cancel();\n    _cancelBufferingWatchdog();\n    unawaited(_saveProgress());",
            ),
            (
              "  Future<void> _exitPlayer() async {\n    if (_isLeaving) return;\n    _isLeaving = true;",
              "  Future<void> _exitPlayer() async {\n    if (_isLeaving) return;\n    _isLeaving = true;\n    _cancelBufferingWatchdog();",
            ),
          ]
          for old, new in anchors:
            if old not in t:
              raise SystemExit(f'anchor missing: {old!r}')
            t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Verify watchdog
        run: |
          grep -q "Timer? _bufferingWatchdog" lib/screens/m3u8_video_player_screen.dart
          grep -q "Duration(seconds: 12)" lib/screens/m3u8_video_player_screen.dart
          grep -q "الخادم عالق في التحميل" lib/screens/m3u8_video_player_screen.dart
          grep -q "_cancelBufferingWatchdog();" lib/screens/m3u8_video_player_screen.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/m3u8_video_player_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(playback): recover from bounded buffering stalls [p0-stall-watchdog]"
          git push origin HEAD:p0/source-health-back-search-registry-2.1.3
