name: Bootstrap missing iOS project

on:
  push:
    branches:
      - bootstrap/theeb-stream-foundation
    paths:
      - ".github/workflows/bootstrap-ios.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-theeb-stream-ios
  cancel-in-progress: false

jobs:
  generate-ios:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate standard iOS host project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create             --platforms=ios             --project-name theeb_stream             --org com.theebstream             .
          test -f ios/Runner/Info.plist
          test -d ios/Runner.xcodeproj

      - name: Commit iOS host project only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ios
          if git diff --cached --quiet; then
            echo "No iOS changes."
            exit 0
          fi
          git commit -m "feat: restore complete iOS host project"
          git restore .
          git clean -fd --exclude=ios/
          git fetch origin bootstrap/theeb-stream-foundation
          git rebase origin/bootstrap/theeb-stream-foundation
          git push origin HEAD:bootstrap/theeb-stream-foundation
