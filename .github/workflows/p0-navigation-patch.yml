name: P0 navigation patch

on:
  push:
    branches:
      - p0/source-health-back-search-registry-2.1.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/source-health-back-search-registry-2.1.3
          fetch-depth: 0

      - name: Add explicit movie back controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/maxstream_details_screen.dart')
          text = path.read_text()

          replacements = [
              (
                  "SliverAppBar(\n            expandedHeight: 300,",
                  "SliverAppBar(\n            leading: BackButton(\n              color: Colors.white,\n              onPressed: () {\n                _youtubeController?.pause();\n                Navigator.of(context).maybePop();\n              },\n            ),\n            expandedHeight: 300,",
              ),
              (
                  "return SliverAppBar(\n      expandedHeight: 350,",
                  "return SliverAppBar(\n      leading: BackButton(\n        color: Colors.white,\n        onPressed: () {\n          _youtubeController?.pause();\n          Navigator.of(context).maybePop();\n        },\n      ),\n      expandedHeight: 350,",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected anchor missing: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify explicit back controls
        run: |
          grep -q "Navigator.of(context).maybePop" lib/screens/maxstream_details_screen.dart
          test "$(grep -c "Navigator.of(context).maybePop" lib/screens/maxstream_details_screen.dart)" -ge 2

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/maxstream_details_screen.dart
          if git diff --cached --quiet; then
            echo "No navigation patch required"
            exit 0
          fi
          git commit -m "fix(navigation): guarantee movie details back controls [p0-back-patched]"
          git push origin HEAD:p0/source-health-back-search-registry-2.1.3
