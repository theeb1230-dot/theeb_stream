name: P0 server inventory UI patch

on:
  push:
    branches:
      - p0/source-health-back-search-registry-2.1.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/source-health-back-search-registry-2.1.3
          fetch-depth: 0
      - name: Surface 27-server migration truthfully
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/provider_health_overview_screen.dart')
          t = p.read_text()
          reps = [
            (
              "import '../services/native_stream_extractor.dart';\n",
              "import '../services/native_stream_extractor.dart';\nimport '../services/theeb_arab_server_registry.dart';\n",
            ),
            (
              "        _summary(confirmed: 0, resolved: confirmed, failed: failed, uncertain: uncertain),\n        Expanded(",
              "        _summary(confirmed: 0, resolved: confirmed, failed: failed, uncertain: uncertain),\n        if (!showGroups) _theebArabInventoryCard(),\n        Expanded(",
            ),
            (
              "  List<Widget> _group(String title, String type, List<SourceProbe> all) {",
              "  Widget _theebArabInventoryCard() {\n    final integrated = TheebArabServerRegistry.integrated.length;\n    final pending = TheebArabServerRegistry.pending.length;\n    return Container(\n      margin: const EdgeInsets.fromLTRB(16, 0, 16, 12),\n      padding: const EdgeInsets.all(14),\n      decoration: BoxDecoration(\n        color: const Color(0xFF161616),\n        border: Border.all(color: Colors.white12),\n        borderRadius: BorderRadius.circular(12),\n      ),\n      child: ExpansionTile(\n        tilePadding: EdgeInsets.zero,\n        childrenPadding: EdgeInsets.zero,\n        collapsedIconColor: Colors.grey,\n        iconColor: Colors.white,\n        title: const Text(\n          'مخزون ذيب العرب: 27 خادمًا',\n          style: TextStyle(color: Colors.white, fontWeight: FontWeight.w700),\n        ),\n        subtitle: Text(\n          '$integrated موجودة أصلًا في Runtime • $pending بانتظار Adapter موثّق',\n          style: const TextStyle(color: Colors.grey, fontSize: 12),\n        ),\n        children: [\n          const Padding(\n            padding: EdgeInsets.only(bottom: 10),\n            child: Text(\n              'الأسماء المسجلة ليست دليل تشغيل. الخادم لا يدخل ترتيب fallback إلا بعد وجود عقد Resolver واختبار Player-Start ناجح.',\n              style: TextStyle(color: Colors.grey, fontSize: 12, height: 1.4),\n            ),\n          ),\n          Wrap(\n            spacing: 6,\n            runSpacing: 6,\n            children: TheebArabServerRegistry.all.map((server) {\n              final active = server.alreadyInRuntime;\n              return Chip(\n                visualDensity: VisualDensity.compact,\n                backgroundColor: active ? Colors.amber.withValues(alpha: 0.15) : Colors.white10,\n                side: BorderSide(color: active ? Colors.amber.shade700 : Colors.white12),\n                label: Text(\n                  server.name,\n                  style: TextStyle(color: active ? Colors.amber : Colors.grey.shade400, fontSize: 11),\n                ),\n              );\n            }).toList(),\n          ),\n        ],\n      ),\n    );\n  }\n\n  List<Widget> _group(String title, String type, List<SourceProbe> all) {",
            ),
          ]
          for old, new in reps:
            if old not in t:
              raise SystemExit(f'anchor missing: {old!r}')
            t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Verify
        run: |
          grep -q "TheebArabServerRegistry" lib/screens/provider_health_overview_screen.dart
          grep -q "مخزون ذيب العرب: 27 خادمًا" lib/screens/provider_health_overview_screen.dart
          grep -q "بانتظار Adapter موثّق" lib/screens/provider_health_overview_screen.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/provider_health_overview_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(servers): surface 27-server migration inventory without false positives [p0-server-inventory]"
          git push origin HEAD:p0/source-health-back-search-registry-2.1.3
