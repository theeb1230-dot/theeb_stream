name: Build Theeb Stream (Mobile + TV)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: theeb-stream-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mobile:
    name: Flutter Mobile APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      EXCLUDE_TV: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks

      - name: Decode Google Services
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -di > android/app/google-services.json

      - name: Generate keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "storeFile=../app/key.jks" > android/keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> android/keystore.properties

      - name: Validate signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Mobile APKs (split per ABI for VLC size)
        run: |
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          ls -lh build/app/outputs/flutter-apk/app-x86_64-release.apk
          mkdir -p build/app/outputs/flutter-apk/arm64-v8a
          mkdir -p build/app/outputs/flutter-apk/armeabi-v7a
          mkdir -p build/app/outputs/flutter-apk/x86_64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/arm64-v8a/Theeb-Stream-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/armeabi-v7a/Theeb-Stream-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/x86_64/Theeb-Stream-Android-Mobile-x86_64.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: theeb-stream-arm64-v8a
          path: build/app/outputs/flutter-apk/arm64-v8a/Theeb-Stream-Android-Mobile-arm64-v8a.apk
          retention-days: 7

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: theeb-stream-armeabi-v7a
          path: build/app/outputs/flutter-apk/armeabi-v7a/Theeb-Stream-Android-Mobile-armeabi-v7a.apk
          retention-days: 7

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: theeb-stream-x86_64
          path: build/app/outputs/flutter-apk/x86_64/Theeb-Stream-Android-Mobile-x86_64.apk
          retention-days: 7

  build-tv:
    name: Kotlin TV APK (FossUniversalRelease)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks

      - name: Generate keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "storeFile=../app/key.jks" > android/keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> android/keystore.properties

      - name: Validate signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-tv-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Compile Kotlin (Foss / Universal) — ./gradlew compileFossUniversalReleaseKotlin
        run: cd android && ./gradlew compileFossUniversalReleaseKotlin --no-daemon

      - name: List tvapp assemble tasks
        run: cd android && ./gradlew :tvapp:tasks --all | grep -i "assemble" || true

      - name: Assemble release APK
        run: cd android && ./gradlew assembleFossUniversalRelease --no-daemon

      - name: Inspect tvapp build outputs after assemble
        run: |
          echo "PWD=$(pwd)"
          ls -la build/tvapp/outputs || true
          find build/tvapp -maxdepth 6 -type f | sed 's#^#FILE #' || true

      - name: Name TV APK for release
        run: |
          mkdir -p release-artifact
          apk="$(find build/tvapp -maxdepth 6 -name '*.apk' -type f | head -n1)"
          test -n "$apk"
          cp "$apk" "release-artifact/Theeb-Stream-Android-TV.apk"

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: theeb-stream-tv
          path: release-artifact/Theeb-Stream-Android-TV.apk
          retention-days: 7


  build-ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          rm -rf release-ios Payload
          mkdir -p release-ios Payload
          cp -R "$app" Payload/Runner.app
          /usr/bin/zip -qry release-ios/Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa Payload
          shasum -a 256 release-ios/Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa > release-ios/SHA256SUMS.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: theeb-stream-ios-unsigned
          path: |
            release-ios/Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa
            release-ios/SHA256SUMS.txt
          retention-days: 7


  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs: [build-mobile, build-tv, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download final build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: theeb-stream-*
          merge-multiple: true
          path: release-files

      - name: Verify required release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-files/Theeb-Stream-Android-Mobile-arm64-v8a.apk
          test -f release-files/Theeb-Stream-Android-TV.apk
          test -f release-files/Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa
          ls -lh release-files

      - name: Generate release checksums and notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          test -n "$version"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          (
            cd release-files
            sha256sum               Theeb-Stream-Android-Mobile-arm64-v8a.apk               Theeb-Stream-Android-TV.apk               Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa               > SHA256SUMS.txt
          )
          cat > release-notes.md <<EOF
          # Theeb Stream $tag

          Final build produced from commit `$GITHUB_SHA` in one GitHub Actions run after all required build jobs succeeded.

          Included platforms:
          - Android Mobile: `Theeb-Stream-Android-Mobile-arm64-v8a.apk`
          - Android TV: `Theeb-Stream-Android-TV.apk`
          - iOS: `Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa`

          Verification:
          - Flutter/branch CI is required before the release trigger is merged.
          - Android Mobile build succeeded in this release workflow.
          - Android TV build succeeded in this release workflow.
          - iOS no-codesign build succeeded in this release workflow.
          - SHA-256 hashes are attached in `SHA256SUMS.txt`.

          iOS note: the IPA is unsigned/no-codesign and is not directly installable on an iPhone without external signing and valid provisioning.
          EOF

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite a published release."
            exit 1
          fi
          gh release create "$tag"             --target "$GITHUB_SHA"             --title "Theeb Stream $tag"             --notes-file release-notes.md             release-files/Theeb-Stream-Android-Mobile-arm64-v8a.apk             release-files/Theeb-Stream-Android-TV.apk             release-files/Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa             release-files/SHA256SUMS.txt

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          gh release view "$tag" --json tagName,url,assets
          names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fx 'Theeb-Stream-Android-Mobile-arm64-v8a.apk' <<<"$names"
          grep -Fx 'Theeb-Stream-Android-TV.apk' <<<"$names"
          grep -Fx 'Theeb-Stream-iOS-UNSIGNED-no-codesign.ipa' <<<"$names"
