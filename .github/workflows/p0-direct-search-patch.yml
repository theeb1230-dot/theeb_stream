name: P0 direct search patch

on:
  push:
    branches:
      - p0/source-health-back-search-registry-2.1.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/source-health-back-search-registry-2.1.3
          fetch-depth: 0

      - name: Apply agreed TMDB direct-search contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/services/tmdb_api_service.dart')
          text = path.read_text()
          old = """  static Future<List<Map<String, dynamic>>> searchAll(\n    String query, {\n    int page = 1,\n  }) => results('/search/multi', {'query': query, 'page': page});\n"""
          new = """  /// Direct cinema search contract shared with Theeb Arab.\n  /// Results are restricted to non-adult content and Arabic/Saudi metadata.\n  static Future<List<Map<String, dynamic>>> searchAll(\n    String query, {\n    int page = 1,\n  }) => results('/search/multi', {\n    'query': query,\n    'page': page,\n    'include_adult': false,\n    'language': 'ar-SA',\n  });\n"""
          if old not in text:
              raise SystemExit('searchAll anchor changed; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify contract
        run: |
          grep -q "'/search/multi'" lib/services/tmdb_api_service.dart
          grep -q "'include_adult': false" lib/services/tmdb_api_service.dart
          grep -q "'language': 'ar-SA'" lib/services/tmdb_api_service.dart

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/tmdb_api_service.dart
          if git diff --cached --quiet; then
            echo "No search patch required"
            exit 0
          fi
          git commit -m "feat(search): align direct TMDB search with Theeb Arab contract [p0-search-patched]"
          git push origin HEAD:p0/source-health-back-search-registry-2.1.3
