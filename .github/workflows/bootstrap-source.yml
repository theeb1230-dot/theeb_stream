# Bootstrap extraction workflow. Original project workflows are staged outside .github
# because GITHUB_TOKEN cannot create/update workflow files during a workflow run.
name: Bootstrap Theeb Stream source

on:
  push:
    branches:
      - bootstrap/theeb-stream-foundation
    paths:
      - ".github/workflows/bootstrap-source.yml"
      - "maxstream-main.zip"

permissions:
  contents: write

concurrency:
  group: bootstrap-theeb-stream-source
  cancel-in-progress: false

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate archive
        shell: bash
        run: |
          set -euo pipefail
          test -f maxstream-main.zip
          unzip -tq maxstream-main.zip

      - name: Extract project safely
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          unzip -q maxstream-main.zip -d "$tmpdir"

          mapfile -t roots < <(find "$tmpdir" -mindepth 1 -maxdepth 1 -printf '%f\n')
          if [ "${#roots[@]}" -eq 1 ] && [ -d "$tmpdir/${roots[0]}" ]; then
            src="$tmpdir/${roots[0]}"
          else
            src="$tmpdir"
          fi

          mkdir -p .bootstrap/original-workflows
          if [ -d "$src/.github/workflows" ]; then
            find "$src/.github/workflows" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
              cp "$f" ".bootstrap/original-workflows/$(basename "$f").txt"
            done
          fi

          rsync -a "$src/" ./ \
            --exclude '.git/' \
            --exclude '.github/workflows/'

          rm maxstream-main.zip

          test -n "$(find . -mindepth 1 -maxdepth 2 -type f ! -path './.git/*' -print -quit)"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: extract application source and remove archive"
          git push origin HEAD:bootstrap/theeb-stream-foundation
