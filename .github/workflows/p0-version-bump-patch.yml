name: P0 version bump patch

on:
  push:
    branches:
      - p0/source-health-back-search-registry-2.1.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/source-health-back-search-registry-2.1.3
          fetch-depth: 0
      - name: Bump release candidate with parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pub = Path('pubspec.yaml')
          ptxt = pub.read_text()
          old = 'version: 2.1.2+18'
          new = 'version: 2.1.3+19'
          if ptxt.count(old) != 1:
            raise SystemExit('pubspec version anchor missing or ambiguous')
          pub.write_text(ptxt.replace(old, new, 1))

          tv = Path('android/tvapp/build.gradle.kts')
          t = tv.read_text()
          pairs = [
            ('versionCode = 18', 'versionCode = 19'),
            ('versionName = "2.1.2"', 'versionName = "2.1.3"'),
          ]
          for old, new in pairs:
            if t.count(old) != 1:
              raise SystemExit(f'TV version anchor missing or ambiguous: {old}')
            t = t.replace(old, new, 1)
          tv.write_text(t)
          PY
      - name: Verify parity
        run: |
          grep -q '^version: 2.1.3+19$' pubspec.yaml
          grep -q 'versionCode = 19' android/tvapp/build.gradle.kts
          grep -q 'versionName = "2.1.3"' android/tvapp/build.gradle.kts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pubspec.yaml android/tvapp/build.gradle.kts
          git commit -m "chore(release): prepare Theeb Stream 2.1.3+19 [p0-version]"
          git push origin HEAD:p0/source-health-back-search-registry-2.1.3
